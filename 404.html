<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Page Not Found</title>
  <script>
    // Single Page App routing fix for GitHub Pages
    
    // The repository name
    const repoName = 'apurbo-portfolio';
    
    // Get the current path including the repo name
    const path = window.location.pathname;
    const repoPath = '/' + repoName + '/';
    
    // Get location details
    const loc = window.location;
    
    // Only do the redirect if we're in a path that should be handled by the router
    if (path.indexOf(repoPath) === 0) {
      // Extract the part after the repo name
      const routePath = path.substr(repoPath.length);
      
      // Create the redirect URL with the route embedded in the query string
      const redirectTo = loc.protocol + '//' + loc.hostname + 
        (loc.port ? ':' + loc.port : '') + 
        repoPath + '?/' + routePath +
        (loc.search ? '&' + loc.search.substr(1) : '') +
        (loc.hash || '');
      
      // Redirect to the new URL
      window.location.replace(redirectTo);
    } else {
      // Not in our repo path, just go to the homepage
      window.location.replace(loc.protocol + '//' + loc.hostname + 
        (loc.port ? ':' + loc.port : '') + repoPath);
    }
  </script>
</head>
<body>
  <h1>Page Not Found</h1>
  <p>If you are not redirected automatically, please click <a href="/apurbo-portfolio/">here</a> to go to the homepage.</p>
</body>
</html>
