<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Page Not Found</title>
  <script>
    // Single Page App routing fix for GitHub Pages
    // Technique based on https://github.com/rafgraph/spa-github-pages
    
    // The repository name (or custom domain if you're using one)
    const pathSegmentsToKeep = 1; // Adjust this if your site is in a subdirectory
    
    const loc = window.location;
    
    // Redirect to the index.html with the full path in the URL
    const newUrl = loc.protocol + '//' + loc.hostname + (loc.port ? ':' + loc.port : '') + 
      loc.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/') + '/?/' + 
      loc.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
      (loc.search ? '&' + loc.search.slice(1) : '') +
      (loc.hash || '');
    
    // Redirect immediately to the new URL with path info
    window.location.replace(newUrl);
  </script>
</head>
<body>
  <h1>Page Not Found</h1>
  <p>If you are not redirected automatically, please click <a href="/apurbo-portfolio/">here</a> to go to the homepage.</p>
</body>
</html>
